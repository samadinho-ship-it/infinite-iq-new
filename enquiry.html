
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>Project Enquiry | INFINITE IQ</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#080812;
color:#f7f5ff;
min-height:100vh;
padding:35px 18px;
line-height:1.6
}

.container{max-width:720px;margin:auto}

.logo{
font-size:23px;
font-weight:900;
margin-bottom:35px;
display:inline-block;
text-decoration:none;
color:white
}

.logo span{color:#9b6cff}

.card{
background:#111120;
border:1px solid rgba(255,255,255,.12);
border-radius:20px;
padding:35px
}

.tag{
color:#50d9ff;
font-size:12px;
letter-spacing:2px;
margin-bottom:12px
}

h1{font-size:36px;line-height:1.2;margin-bottom:12px}

.gradient{
background:linear-gradient(100deg,#9b6cff,#50d9ff);
-webkit-background-clip:text;
background-clip:text;
color:transparent
}

.intro{color:#aaa8c0;margin-bottom:28px}

label{
display:block;
font-size:14px;
font-weight:bold;
margin:20px 0 8px
}

input,select,textarea{
width:100%;
padding:14px;
background:#090916;
color:white;
border:1px solid rgba(255,255,255,.15);
border-radius:10px;
font:inherit;
outline:none
}

input:focus,select:focus,textarea:focus{
border-color:#9b6cff
}

textarea{min-height:130px;resize:vertical}

button{
width:100%;
margin-top:25px;
padding:15px;
border:0;
border-radius:30px;
background:linear-gradient(100deg,#9b6cff,#6652dc);
color:white;
font-size:15px;
font-weight:bold;
cursor:pointer
}

button:hover{opacity:.9}

.note{
color:#aaa8c0;
font-size:12px;
margin-top:15px
}

.back{
display:inline-block;
margin-top:25px;
color:#50d9ff;
text-decoration:none;
font-size:14px
}

footer{
text-align:center;
color:#77758d;
font-size:12px;
margin-top:30px
}

@media(max-width:600px){
.card{padding:24px 19px}
h1{font-size:30px}
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="logo">
INFINITE<span> IQ</span>
</a>

<div class="card">

<div class="tag">LET'S BUILD SOMETHING GREAT</div>

<h1>Start Your <span class="gradient">Project.</span></h1>

<p class="intro">
Tell us about your business and your idea. We'll review your enquiry and get back to you.
</p>

<form
action="https://formsubmit.app/f/negj8tb4h4"
method="POST"
>

<input
type="hidden"
name="_redirect"
value="https://samadinho-ship-it.github.io/infinite-iq-new/thank-you.html"

>

<input
type="hidden"
name="_replyto"
id="replyTo"
value=""
>

<input
type="hidden"
name="_ts"
id="formTimestamp"
value=""
>

<!-- Spam protection -->
<div style="position:absolute;left:-9999px" aria-hidden="true">
<label for="website">Leave this field empty</label>
<input
type="text"
id="website"
name="_gotcha"
tabindex="-1"
autocomplete="off"
>
</div>

<label for="name">Your full name *</label>
<input
id="name"
name="name"
required
maxlength="100"
placeholder="Enter your name"
>

<label for="business">Business name *</label>
<input
id="business"
name="business"
required
maxlength="100"
placeholder="Enter your business name"
>

<label for="email">Your email address *</label>
<input
id="email"
name="email"
type="email"
required
maxlength="150"
placeholder="you@example.com"
>

<label for="package">Which package interests you? *</label>

<select id="package" name="package" required>
<option value="">Choose a package</option>
<option value="Starter Website">Starter Website</option>
<option value="Professional Website">Professional Website</option>
<option value="Premium Website">Premium Website</option>
<option value="Not sure yet">Not sure yet</option>
</select>

<label for="description">Tell us about your project *</label>

<textarea
id="description"
name="description"
required
maxlength="3000"
placeholder="What kind of website do you want? What should it do?"
></textarea>

<button type="submit">
Send My Enquiry ↗
</button>

</form>

<p class="note">
Your project enquiry will be submitted securely through our form service.
</p>

<a href="index.html" class="back">
← Back to INFINITE IQ
</a>

</div>

<footer>
© <span id="year"></span> INFINITE IQ · Ideas Without Limits.
</footer>

</div>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();

document.getElementById("formTimestamp").value =
Date.now();

const emailInput = document.getElementById("email");

emailInput.addEventListener("input", function(){
document.getElementById("replyTo").value =
emailInput.value.trim();
});

const params = new URLSearchParams(window.location.search);
const selected = params.get("package");

const packageOptions = {
starter: "Starter Website",
professional: "Professional Website",
premium: "Premium Website"
};

if(selected && packageOptions[selected]){
document.getElementById("package").value =
packageOptions[selected];
}
</script>

</body>
</html>
